<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Imagi Studio · 3D Logo</title>
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; overflow: hidden; transition: background-color .25s; }
  canvas { position: relative; z-index: 0; display: block; width: 100vw; height: 100vh; opacity: 0; transition: opacity 0.9s ease; touch-action: none; }
  .hint {
    position: fixed; z-index: 5; left: 0; right: 0; bottom: 28px; text-align: center;
    font: 500 12px/1 ui-sans-serif, system-ui, -apple-system, sans-serif;
    letter-spacing: 0.14em; text-transform: uppercase; color: #b5b5bd;
    pointer-events: none; user-select: none;
  }

  :root {
    --panel: rgba(255,255,255,0.82); --line: rgba(20,20,40,0.08); --ink: #1d1d27; --mute: #8a8a98;
    --accent: #4257b8; --field: rgba(20,20,40,0.05);
  }
  #panel {
    position: fixed; z-index: 10; top: 16px; right: 16px; width: 300px; max-height: calc(100vh - 32px); overflow: auto;
    background: var(--panel); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
    border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 10px 40px rgba(20,20,60,0.10);
    font: 500 12px/1.3 ui-sans-serif, system-ui, -apple-system, sans-serif; color: var(--ink);
    transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .25s; scrollbar-width: thin;
  }
  #panel.hidden { transform: translateX(calc(100% + 24px)); opacity: 0; pointer-events: none; }
  #toggle {
    position: fixed; top: 16px; right: 16px; z-index: 11; height: 32px; padding: 0 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(12px); cursor: pointer;
    font: 600 12px ui-sans-serif, system-ui, sans-serif; color: var(--ink); display: none;
  }
  #panel.hidden ~ #toggle { display: block; }
  .sec { padding: 14px 16px; border-top: 1px solid var(--line); }
  .sec:first-child { border-top: 0; }
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .title { font-weight: 650; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
  .iconbtn { border: 0; background: none; color: var(--mute); cursor: pointer; font: inherit; padding: 2px 4px; border-radius: 6px; }
  .iconbtn:hover { color: var(--ink); background: var(--field); }
  .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 12px; }
  .tab {
    height: 38px; border-radius: 10px; border: 1.5px solid transparent; background: var(--field); cursor: pointer;
    font: 800 15px ui-rounded, system-ui, sans-serif; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.18);
    transition: transform .15s, border-color .15s;
  }
  .tab:hover { transform: translateY(-1px); }
  .tab.on { border-color: var(--ink); }
  .row { display: grid; grid-template-columns: 72px 1fr 46px; align-items: center; gap: 8px; margin: 7px 0; }
  .row label { color: var(--mute); white-space: nowrap; }
  .row output, .row .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 4px; background: rgba(20,20,40,0.12); outline: none; margin: 0; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 1.5px solid var(--ink); cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 1.5px solid var(--ink); cursor: pointer; }
  input[type=color] { -webkit-appearance: none; appearance: none; width: 100%; height: 26px; border: 1px solid var(--line); border-radius: 8px; padding: 0; background: none; cursor: pointer; }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
  input[type=color]::-webkit-color-swatch { border: 0; border-radius: 6px; }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper button { width: 26px; height: 24px; border-radius: 7px; border: 0; background: var(--field); cursor: pointer; font: 600 14px system-ui; color: var(--ink); }
  .stepper button:hover { background: rgba(20,20,40,.1); }
  .stepper span { min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 650; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--field); border-radius: 10px; padding: 3px; margin-bottom: 12px; }
  .seg button { height: 28px; border: 0; border-radius: 8px; background: none; cursor: pointer; font: 600 12px system-ui, sans-serif; color: var(--mute); }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .gbar { position: relative; height: 26px; border-radius: 8px; border: 1px solid var(--line); cursor: copy; margin: 4px 7px 22px; }
  .stop {
    position: absolute; top: 100%; width: 14px; height: 14px; margin: 3px 0 0 -7px; border-radius: 50%;
    border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(20,20,40,.35), 0 1px 3px rgba(0,0,0,.2); cursor: grab;
  }
  .stop.on { box-shadow: 0 0 0 2px var(--ink), 0 1px 3px rgba(0,0,0,.2); }
  .stoprow { display: grid; grid-template-columns: 1fr 64px 28px; gap: 8px; align-items: center; }
  .stoprow input[type=number] { width: 100%; box-sizing: border-box; height: 26px; border: 1px solid var(--line); border-radius: 8px; padding: 0 6px; font: inherit; background: #fff; }
  .del { height: 26px; border: 0; border-radius: 8px; background: var(--field); cursor: pointer; color: var(--mute); font-size: 14px; }
  .del:hover { color: #c33; }
  .add { width: 100%; height: 30px; margin-top: 10px; border-radius: 9px; border: 1px dashed rgba(20,20,40,.22); background: none; cursor: pointer; font: 600 12px system-ui, sans-serif; color: var(--ink); }
  .add:hover { background: var(--field); border-style: solid; }
  .row output { cursor: text; border-radius: 5px; padding: 1px 3px; outline: none; }
  .row output:hover { background: var(--field); }
  .row output:focus { background: #fff; box-shadow: 0 0 0 1.5px var(--ink); }
  select { width: 100%; height: 26px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font: inherit; color: var(--ink); padding: 0 6px; }
  .slots { display: grid; gap: 6px; margin-bottom: 8px; }
  .slot { display: grid; grid-template-columns: 18px 1fr 64px 52px; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 10px; background: var(--field); }
  .slot b { font-weight: 750; }
  .slot .st { color: var(--mute); font-size: 11px; }
  .slot.has .st { color: var(--ink); }
  .slot button { height: 26px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; font: 600 11px system-ui, sans-serif; color: var(--ink); }
  .slot button:disabled { opacity: .4; cursor: default; }
  details.adv > summary { cursor: pointer; list-style: none; }
  details.adv > summary::before { content: '▸ '; }
  details.adv[open] > summary::before { content: '▾ '; }
  .note { color: var(--mute); font-size: 11px; margin-top: 6px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .actions button { height: 30px; border-radius: 9px; border: 1px solid var(--line); background: #fff; cursor: pointer; font: 600 12px system-ui, sans-serif; color: var(--ink); }
  .actions button:hover { background: var(--field); }
  [hidden] { display: none !important; }
  .sub { font-weight: 600; color: var(--ink); margin: 2px 0 8px; }
  body.cmd canvas { cursor: grab; }
  .seg3 { grid-template-columns: repeat(3, 1fr); margin-bottom: 8px; }
  .check { display: flex; align-items: center; gap: 8px; margin: 8px 0 10px; color: var(--ink); cursor: pointer; user-select: none; }
  .check input { accent-color: var(--ink); width: 14px; height: 14px; margin: 0; }
  .primary { width: 100%; height: 34px; border-radius: 10px; border: 0; background: var(--ink); color: #fff; cursor: pointer; font: 650 12px system-ui, sans-serif; }
  .primary:hover { background: #33334a; }
  .primary:disabled { opacity: .6; cursor: progress; }
  #zoombar {
    position: fixed; z-index: 10; left: 16px; bottom: 16px; display: flex; align-items: center; gap: 2px; padding: 4px;
    background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 6px 24px rgba(20,20,60,.08);
    font: 600 12px ui-sans-serif, system-ui, sans-serif; color: var(--ink); user-select: none;
  }
  #zoombar button { height: 30px; min-width: 30px; padding: 0 9px; border: 0; border-radius: 8px; background: none; cursor: pointer; font: inherit; color: inherit; display: flex; align-items: center; gap: 6px; }
  #zoombar button:hover { background: var(--field); }
  #zoombar button.on { background: var(--ink); color: #fff; }
  #zoombar .pct { min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; color: var(--mute); }
  #zoombar .sep { width: 1px; height: 18px; background: var(--line); margin: 0 3px; }
  body.zooming canvas { cursor: grab; }
  body.zooming.panning canvas { cursor: grabbing; }
  @media (max-width: 640px) { #zoombar { bottom: calc(46vh + 12px); } }
  @media (max-width: 640px) {
    #panel { top: auto; bottom: 0; right: 0; left: 0; width: auto; max-height: 46vh; border-radius: 16px 16px 0 0; }
    #panel.hidden { transform: translateY(100%); }
    .hint { display: none; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="hint">Drag or flick a letter · ⌘ + drag to pan · Z zoom · H toggles controls</div>
<div id="panel">
  <div class="sec">
    <div class="head"><span class="title">Logo colour</span><button class="iconbtn" id="hide" title="Hide panel (H)">Hide ✕</button></div>
    <div class="seg"><button id="mSolid">Solid</button><button id="mGrad">Gradient</button></div>
    <div class="row" id="solidRow"><label>Colour</label><input type="color" id="lcol"><span></span></div>
    <div id="gradUI"></div>
  </div>
  <div class="sec">
    <div class="head"><span class="title">Background</span></div>
    <div class="seg"><button id="bgSolid">Solid</button><button id="bgGradBtn">Gradient</button></div>
    <div class="row" id="bgSolidRow"><label>Colour</label><input type="color" id="bgc"><span></span></div>
    <div id="bgGrad"></div>
  </div>
  <div class="sec">
    <div class="head"><span class="title">Animate</span></div>
    <div class="slots">
      <div class="slot" data-k="A"><b>A</b><span class="st">Empty</span><button class="save">Save A</button><button class="show">Show</button></div>
      <div class="slot" data-k="B"><b>B</b><span class="st">Empty</span><button class="save">Save B</button><button class="show">Show</button></div>
    </div>
    <div class="row"><label>Duration</label><input type="range" id="adur" min="0.4" max="8" step="0.1"><output id="aduro"></output></div>
    <div class="row"><label>Ease</label><select id="aease">
      <option value="smooth">Smooth</option><option value="linear">Linear</option><option value="out">Ease out</option>
      <option value="back">Overshoot</option><option value="bounce">Bounce</option><option value="elastic">Elastic</option></select><span></span></div>
    <div class="row" id="astrRow"><label>Strength</label><input type="range" id="astr" min="0" max="3" step="0.05"><output id="astro"></output></div>
    <div class="seg seg3" id="aplay"><button data-m="ab">A → B</button><button data-m="loop">Loop A ↔ B</button><button data-m="stop">Stop</button></div>
    <div class="note">Set up a look, Save A. Change anything (letters, spacing, colours, background, light), Save B, then play.</div>
  </div>
  <div class="sec">
    <div class="head"><span class="title">Export PNG</span></div>
    <div class="seg seg3" id="scales"><button data-s="2">2×</button><button data-s="4">4×</button><button data-s="8">8×</button></div>
    <div class="note" id="exdim" style="margin:0 0 4px"></div>
    <label class="check"><input type="checkbox" id="extr">Transparent background</label>
    <button class="primary" id="export">Export PNG</button>
  </div>
  <details class="sec adv">
    <summary class="title">Advanced</summary>
    <div class="sub" style="margin-top:12px">Letter</div>
    <div class="tabs" id="tabs"></div>
    <div class="row"><label>Rotate X</label><input type="range" id="rx" min="-180" max="180" step="1"><output id="rxo"></output></div>
    <div class="row"><label>Rotate Y</label><input type="range" id="ry" min="-180" max="180" step="1"><output id="ryo"></output></div>
    <div class="row"><label>Rotate Z</label><input type="range" id="rz" min="-180" max="180" step="1"><output id="rzo"></output></div>
    <div class="row"><label>Lift</label><input type="range" id="ly" min="-0.5" max="0.5" step="0.01"><output id="lyo"></output></div>
    <div class="row"><label>Z-index</label><div class="stepper"><button id="zdn">−</button><span id="zv">0</span><button id="zup">+</button></div><span></span></div>
    <div class="actions" style="margin:6px 0 2px"><button id="zeroOne">Zero this letter</button><button id="zeroAll">Zero all letters</button></div>
    <div class="sub" style="margin-top:14px">Spacing</div>
    <div class="row"><label>Tracking</label><input type="range" id="trk" min="-0.3" max="0.6" step="0.005"><output id="trko"></output></div>
    <div id="gaps"></div>
    <div class="sub" style="margin-top:14px">Light</div>
    <div class="row"><label>Brightness</label><input type="range" id="lexp" min="0.3" max="2" step="0.01"><output id="lexpo"></output></div>
    <div class="row"><label>Shadow str.</label><input type="range" id="lcon" min="0" max="1" step="0.01"><output id="lcono"></output></div>
    <div class="row"><label>Cast shadow</label><input type="range" id="lsha" min="0" max="1" step="0.01"><output id="lshao"></output></div>
    <div class="row"><label>Direction</label><input type="range" id="lang" min="-180" max="180" step="1"><output id="lango"></output></div>
    <div class="row"><label>Height</label><input type="range" id="lhei" min="5" max="85" step="1"><output id="lheio"></output></div>
  </details>
  <div class="sec actions"><button id="copy">Copy settings</button><button id="reset">Reset</button></div>
</div>
<button id="toggle">Controls</button>
<div id="zoombar">
  <button id="zmode" title="Zoom & pan mode (Z): scroll to zoom, drag to pan. Hold ⌘ and drag to pan any time.">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg>Zoom</button>
  <span class="sep"></span>
  <button id="zout" title="Zoom out">−</button>
  <span class="pct" id="zpct">100%</span>
  <button id="zin" title="Zoom in">+</button>
  <button id="zfit" title="Reset view">Fit</button>
</div>

function parsePath(dstr) {
  const toks = dstr.match(/[MLHVCZ]|-?\d*\.?\d+(?:e-?\d+)?/gi);
  const subs = []; let cur = null, x = 0, y = 0, cmd = '', i = 0;
  const num = () => parseFloat(toks[i++]);
  while (i < toks.length) {
    if (/[A-Za-z]/.test(toks[i])) cmd = toks[i++];
    if (cmd === 'M') { x = num(); y = num(); cur = [[x, y]]; subs.push(cur); cmd = 'L'; }
    else if (cmd === 'L') { x = num(); y = num(); cur.push([x, y]); }
    else if (cmd === 'H') { x = num(); cur.push([x, y]); }
    else if (cmd === 'V') { y = num(); cur.push([x, y]); }
    else if (cmd === 'C') {
      const x1 = num(), y1 = num(), x2 = num(), y2 = num(), x3 = num(), y3 = num();
      for (let t = 1; t <= 12; t++) {
        const u = t / 12, m = 1 - u;
        cur.push([m*m*m*x + 3*m*m*u*x1 + 3*m*u*u*x2 + u*u*u*x3, m*m*m*y + 3*m*m*u*y1 + 3*m*u*u*y2 + u*u*u*y3]);
      }
      x = x3; y = y3;
    } else if (cmd === 'Z' || cmd === 'z') { cmd = ''; }

  return subs;
}

function gaussBlur(src, nx, ny, sigma) {

  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    let a = 0; for (let k = -rad; k <= rad; k++) a += ker[k + rad] * src[Math.min(Math.max(i + k, 0), nx - 1) + nx * j];
    tmp[i + nx * j] = a;
  }
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    let a = 0; for (let k = -rad; k <= rad; k++) a += ker[k + rad] * tmp[i + nx * Math.min(Math.max(j + k, 0), ny - 1)];
    out[i + nx * j] = a;
  }

}

function buildGeometry(shape, step) {

    const z = z0 + k * step;

  }
  const P = (i, j, k) => i + nx * (j + ny * k);

  const cnx = nx - 1, cny = ny - 1, cnz = nz - 1;
  const C = (i, j, k) => i + cnx * (j + cny * k);

    const gy = (f3(x, y + e, z) - f3(x, y - e, z)) / (2 * e);
    const gz = (f3(x, y, z + e) - f3(x, y, z - e)) / (2 * e);

  const tri = (a, b, c) => {
    const ax = pos[a*3], ay = pos[a*3+1], az = pos[a*3+2];
    const ux = pos[b*3] - ax, uy = pos[b*3+1] - ay, uz = pos[b*3+2] - az;

    a = cellV[a]; b = cellV[b]; c = cellV[c]; d = cellV[d];

const GLASS_PARS = `

varying vec3 vLetterZ;
// Two-surface refraction through a pillow-shaped slab: refract in at the front, travel the
// local thickness, refract out through the mirrored back surface, then continue to whatever
// sits behind. Returns the view-space sideways shift of that ray vs. a straight one.
vec2 slabShift(vec3 I, vec3 N, vec3 Z, float ior, float t) {
  vec3 Nb = N - 2.0 * dot(N, Z) * Z;                  // outward normal of the back surface
  vec3 r1 = refract(I, N, 1.0 / ior);
  float L = t / max(dot(r1, -Z), 0.3);
  vec3 r2 = refract(r1, -Nb, ior);
  if (dot(r2, r2) < 1e-4) r2 = reflect(r1, -Nb);      // total internal reflection
  const float D = 0.55;                               // gap to the layer behind
  return (r1 * L + r2 * D - I * (L + D)).xy;

  const float start = 0.76, desat = 0.15;

  color -= x < 0.08 ? x - 6.25 * x * x : 0.04;
  float peak = max(color.r, max(color.g, color.b));
  if (peak < start) return color;
  float d = 1.0 - start, np = 1.0 - d * d / (peak + d - start);
  color *= np / peak;
  return mix(color, vec3(np), 1.0 - 1.0 / (desat * (peak - np) + 1.0));

  vec3 Z = normalize(vLetterZ);
  float facing = dot(Nn, Z);
  Z *= facing < 0.0 ? -1.0 : 1.0;                    // whichever side of the letter faces us
  float t = 0.44 * smoothstep(0.0, 0.85, abs(facing)); // thinner toward the rim
  vec2 suv = gl_FragCoord.xy / uRes;
  vec2 toUv = vec2(uRes.y / uRes.x, 1.0) / (2.0 * vViewPosition.z * uTanHalf);

  vec2 oG = slabShift(I, Nn, Z, uIor, t) * toUv;
  vec2 oB = slabShift(I, Nn, Z, uIor + dd, t) * toUv;

  if (A.colorMode === B.colorMode && A.colorMode !== 'gradient') o.solid = lerpHex(A.solid, B.solid, t);
  else { o.colorMode = 'gradient'; o.grad = blendGrad(A.colorMode, A.solid, A.grad, B.colorMode, B.solid, B.grad, t); }
  if (A.bgMode === B.bgMode && A.bgMode !== 'gradient') o.bg = lerpHex(A.bg, B.bg, t);
  else { o.bgMode = 'gradient'; o.bgGrad = blendGrad(A.bgMode, A.bg, A.bgGrad, B.bgMode, B.bg, B.bgGrad, t); }
  o.exportScale = S.exportScale; o.exportTransparent = S.exportTransparent;
  return o;
}
function showLook(k) { if (!SLOTS[k]) return; ANIM.mode = 'stop'; S = structuredClone(SLOTS[k]); applySettings(true); syncUI(); syncScene(); syncAnimUI(); }
function syncAnimUI() {
  document.querySelectorAll('.slot').forEach(el => { const has = !!SLOTS[el.dataset.k]; el.classList.toggle('has', has);
    el.querySelector('.st').textContent = has ? 'Saved' : 'Empty'; el.querySelector('.show').disabled = !has; });
  const ready = SLOTS.A && SLOTS.B;
  document.querySelectorAll('#aplay button').forEach(b => { b.classList.toggle('on', b.dataset.m === ANIM.mode); if (b.dataset.m !== 'stop') b.disabled = !ready; });
  $('adur').value = ANIM.dur; $('aduro').textContent = ANIM.dur.toFixed(1) + 's';
  $('aease').value = ANIM.ease; $('astr').value = ANIM.strength; $('astro').textContent = ANIM.strength.toFixed(2);
  $('astrRow').hidden = !STRENGTH_EASES.includes(ANIM.ease);
}
document.querySelectorAll('.slot').forEach(el => {
  el.querySelector('.save').onclick = () => { SLOTS[el.dataset.k] = structuredClone(S); const b = el.querySelector('.save'); b.textContent = 'Saved ✓'; setTimeout(() => b.textContent = 'Save ' + el.dataset.k, 900); syncAnimUI(); };
  el.querySelector('.show').onclick = () => showLook(el.dataset.k);
});
$('adur').oninput = (e) => { ANIM.dur = +e.target.value; syncAnimUI(); };
$('aease').onchange = (e) => { ANIM.ease = e.target.value; syncAnimUI(); };
$('astr').oninput = (e) => { ANIM.strength = +e.target.value; syncAnimUI(); };
document.querySelectorAll('#aplay button').forEach(b => b.onclick = () => {
  const m = b.dataset.m;
  if (m === 'stop') { ANIM.mode = 'stop'; syncAnimUI(); return; }
  if (!SLOTS.A || !SLOTS.B) return;
  ANIM.mode = m; ANIM.t = 0; ANIM.dir = 1; syncAnimUI();
});
function stepAnim(dt) {
  if (ANIM.mode === 'stop') return;
  ANIM.t += ANIM.dir * dt / ANIM.dur;
  if (ANIM.mode === 'ab' && ANIM.t >= 1) { ANIM.t = 1; ANIM.mode = 'stop'; }
  if (ANIM.mode === 'loop') { if (ANIM.t >= 1) { ANIM.t = 1; ANIM.dir = -1; } else if (ANIM.t <= 0) { ANIM.t = 0; ANIM.dir = 1; } }
  const x = Math.min(Math.max(ANIM.t, 0), 1), f = EASES[ANIM.ease], k = ANIM.strength;
  const e = ANIM.dir > 0 ? f(x, k) : 1 - f(1 - x, k);   // heading back to A, the bounce lands on A
  S = (ANIM.mode === 'stop' && ANIM.t >= 1) ? structuredClone(SLOTS.B) : blendLooks(SLOTS.A, SLOTS.B, e);
  applySettings(true);
  if (ANIM.mode === 'stop') { syncUI(); syncScene(); syncAnimUI(); }
}
syncAnimUI();

// zero the selected letter / every letter (rotation, lift, depth)
const zero = (L) => Object.assign(L, { rx: 0, ry: 0, rz: 0, y: 0, z: 0 });
$('zeroOne').onclick = () => { zero(S.letters[sel]); applySettings(); syncUI(); };
$('zeroAll').onclick = () => { S.letters.forEach(zero); applySettings(); syncUI(); };

// type a value straight into any slider's readout: click the number, type, Enter (or click away)
function editableOutputs() {
  document.querySelectorAll('#panel .row output').forEach(o => { if (o.isContentEditable) return; o.contentEditable = 'true'; o.spellcheck = false; });
}
editableOutputs();
new MutationObserver(editableOutputs).observe($('panel'), { childList: true, subtree: true });
function commitOutput(o) {
  const range = o.parentElement.querySelector('input[type=range]'); if (!range) return;
  const txt = o.textContent.trim(), n = parseFloat(txt.replace(',', '.').replace(/[^0-9.+-]/g, ''));
  if (!isNaN(n)) {
    const v = txt.endsWith('%') || o.dataset.pct ? n / 100 : n;        // "65%" sliders store 0.65
    range.value = Math.min(+range.max, Math.max(+range.min, v));
  }
  range.dispatchEvent(new Event('input', { bubbles: true }));          // apply + redraw the formatted value
}
$('panel').addEventListener('focusin', e => { const o = e.target; if (o.matches?.('.row output')) { o.dataset.pct = o.textContent.trim().endsWith('%') ? '1' : ''; requestAnimationFrame(() => document.getSelection().selectAllChildren(o)); } });
$('panel').addEventListener('keydown', e => { const o = e.target; if (!o.matches?.('.row output')) return;
  if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); o.blur(); }
  e.stopPropagation(); });
$('panel').addEventListener('focusout', e => { const o = e.target; if (o.matches?.('.row output')) commitOutput(o); });

function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 30), t = clock.elapsedTime;
  stepAnim(dt);
  const ease = 1 - Math.exp(-8 * dt);

  // camera follows word width; slides so the word sits clear of the panel
  const ct = camTarget();
  camera.position.x += (ct.x - camera.position.x) * ease;
  camera.position.y += (ct.y - camera.position.y) * ease;
  camera.position.z += (ct.z - camera.position.z) * ease;
  camera.lookAt(camera.position.x, camera.position.y - 0.15, 0);

  for (const L of letters) {
    L.base.lerp(L.target, ease);
    L.rest.slerp(L.restTarget, ease);
    if (L !== drag.L) {
      const q = L.spin;
      if (q.w < 0) q.set(-q.x, -q.y, -q.z, -q.w);
      const half = Math.acos(Math.min(q.w, 1)), sh = Math.sin(half);
      if (sh > 1e-6) rv.set(q.x, q.y, q.z).multiplyScalar(2 * half / sh); else rv.set(0, 0, 0);
      L.w.addScaledVector(rv, -K * dt).multiplyScalar(Math.exp(-DAMP * dt));
      const ang = L.w.length() * dt;
      if (ang > 1e-7) { tmpQ.setFromAxisAngle(tmpV.copy(L.w).normalize(), ang); q.premultiply(tmpQ).normalize(); }
    }
    L.hover += (L.hoverT - L.hover) * (1 - Math.exp(-10 * dt));
    L.press += ((L === drag.L ? 1 : 0) - L.press) * (1 - Math.exp(-14 * dt));

    const p = L.phase;
    idleE.set(Math.sin(t * 0.63 + p) * 0.07, Math.sin(t * 0.47 + p * 1.7) * 0.12, Math.sin(t * 0.71 + p * 0.6) * 0.035, 'YXZ');
    idleQ.setFromEuler(idleE);
    L.mesh.quaternion.copy(L.spin).multiply(L.rest).multiply(idleQ);
    L.mesh.position.set(
      L.base.x,
      L.base.y + Math.sin(t * 0.9 + p) * 0.035 + L.hover * 0.03,
      L.base.z + Math.sin(t * 0.55 + p * 2.1) * 0.04 + L.hover * 0.08 + L.press * 0.15
    );
    const sc = 1 + L.hover * 0.025 + L.press * 0.03;
    L.mesh.scale.setScalar(sc);
  }

  // whole word leans gently toward the cursor
  const tx = pointer.inside ? pointer.y * -0.08 : 0, ty = pointer.inside ? pointer.x * 0.12 : 0;
  gx += (tx - gx) * (1 - Math.exp(-3 * dt)); gy += (ty - gy) * (1 - Math.exp(-3 * dt));
  word.rotation.set(gx, gy, 0);
  word.position.y = Math.sin(t * 0.5) * 0.02;

  renderFrame();
  requestAnimationFrame(frame);
}
frame();
requestAnimationFrame(() => { canvasReady = true; cv.style.opacity = layered() ? 1 : S.opacity; });
</script>
