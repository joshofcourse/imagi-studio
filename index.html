<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Imagi Studio</title>
<style>
:root{--panel:rgba(255,252,245,.82);--fg:#1d2a1c;--mut:#7b7766;--acc:#1F6B3A;--line:rgba(30,40,20,.1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#E8DCC3;font:11.5px/1.3 -apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;color:var(--fg)}
canvas{display:block;width:100vw;height:100vh;cursor:crosshair;touch-action:none}
.seg{display:grid;gap:3px;padding:3px;margin:4px 0 6px;background:rgba(30,40,20,.06);border-radius:8px}
.seg button{border:0;background:transparent;padding:5px 0;color:var(--mut);font-size:10.5px}
.seg button.on{background:var(--acc);color:#f4f0e2}
/* master navigation */
#nav{position:fixed;top:0;left:0;right:0;height:46px;z-index:10;display:flex;align-items:center;gap:18px;padding:0 16px;background:var(--panel);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
#nav .brand{font-weight:700;letter-spacing:.02em;font-size:12.5px}
#nav .tabs{display:flex;gap:3px;padding:3px;background:rgba(30,40,20,.06);border-radius:9px}
#nav .tabs button{border:0;background:transparent;padding:6px 12px;color:var(--mut);font-size:11.5px}
#nav .tabs button.on{background:var(--acc);color:#f4f0e2}
#icons{position:fixed;top:46px;left:0;right:0;bottom:0;display:none}
#icons canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
#icons .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;pointer-events:none;color:rgba(40,50,30,.5)}
#icons .empty b{font-size:16px;color:rgba(40,50,30,.7)}
body[data-tab=icons] #gl, body[data-tab=icons] #hint, body[data-tab=icons] #pop, body[data-tab=icons] #panel{display:none !important}
body[data-tab=icons] #icons{display:block}
#logoFrame{position:fixed;top:46px;left:0;width:100%;height:calc(100% - 46px);border:0;display:none;z-index:1}
body[data-tab=logo] #gl, body[data-tab=logo] #hint, body[data-tab=logo] #pop, body[data-tab=logo] #panel{display:none !important}
body[data-tab=logo] #logoFrame{display:block}
#iconPanel{position:absolute;top:14px;right:14px;width:210px;padding:9px 11px 11px;background:var(--panel);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(60,50,20,.18);user-select:none}
#iconPanel .thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0}
#iconPanel .thumbs button{position:relative;padding:0;aspect-ratio:1;border-radius:9px;background:rgba(30,40,20,.05);border:1.5px solid transparent;overflow:hidden}
#iconPanel .thumbs button.on{border-color:var(--acc);background:rgba(31,107,58,.08)}
#iconPanel .thumbs canvas{position:static;inset:auto;width:100%;height:100%;display:block;cursor:pointer}
#iconPanel .ihead{padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:2px}
#hint{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:rgba(40,50,30,.45);font-size:14px;letter-spacing:.04em;transition:opacity .6s}
#panel{position:fixed;top:60px;right:14px;width:232px;max-height:calc(100vh - 74px);display:flex;flex-direction:column;background:var(--panel);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(60,50,20,.18);user-select:none}
#panel.hidden{display:none}
#head{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;cursor:pointer;border-bottom:1px solid var(--line)}
#head b{font-weight:650;letter-spacing:.02em}
#head span{color:var(--mut);font-size:10px}
#body{overflow:auto;padding:4px 11px 11px}
#panel.collapsed #body{display:none}
#panel.collapsed #head{border-bottom:0}
details{border-bottom:1px solid var(--line);padding:6px 0}
summary{cursor:pointer;color:var(--mut);text-transform:uppercase;font-size:9.5px;letter-spacing:.09em;list-style:none;padding:2px 0 4px}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";}
details[open] summary::before{content:"▾ ";}
.row{margin:5px 0 7px}
.row .lab{display:flex;justify-content:space-between;margin-bottom:3px}
.row .lab em{font-style:normal;color:var(--mut);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;background:rgba(30,40,20,.15);border-radius:2px;outline:none;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--acc);cursor:pointer}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:var(--acc);cursor:pointer}
.pals{display:flex;flex-direction:column;gap:5px;margin:4px 0}
.pal{display:flex;align-items:center;gap:6px;padding:4px 5px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.pal:hover{background:rgba(30,40,20,.05)}
.pal.on{border-color:rgba(30,40,20,.35)}
.pal .sw{display:flex;border-radius:3px;overflow:hidden;height:12px;flex:1;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.pal .sw i{flex:1}
.pal small{width:60px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.chips button{padding:4px 8px;font-size:10.5px;color:var(--mut)}
.chips button.on{background:var(--acc);color:#f4f0e2;border-color:var(--acc)}
.tog{display:flex;align-items:center;justify-content:space-between;margin:8px 0 2px;cursor:pointer}
.tog .k{width:26px;height:15px;border-radius:8px;background:rgba(30,40,20,.2);position:relative;transition:.2s}
.tog .k::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#fff;transition:.2s}
.tog.on .k{background:var(--acc)}
.tog.on .k::after{left:13px}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:9px}
button{font:inherit;color:var(--fg);background:rgba(30,40,20,.06);border:1px solid var(--line);border-radius:6px;padding:6px 0;cursor:pointer}
button:hover{background:rgba(30,40,20,.12)}
button.pri{background:var(--acc);border-color:var(--acc);color:#f4f0e2;font-weight:600}
.sub{color:var(--mut);font-size:10px;margin:8px 0 2px}
.colors{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0}
.colors input,.bgrow input{-webkit-appearance:none;appearance:none;width:26px;height:26px;padding:0;border:1px solid var(--line);border-radius:7px;background:none;cursor:pointer}
.colors input::-webkit-color-swatch-wrapper,.bgrow input::-webkit-color-swatch-wrapper{padding:0}
.colors input::-webkit-color-swatch,.bgrow input::-webkit-color-swatch{border:0;border-radius:6px}
.bgrow{display:flex;align-items:center;justify-content:space-between;margin:8px 0 2px;color:var(--mut);font-size:10px}
#pop{position:fixed;z-index:4;display:none;top:60px;left:14px;width:200px;padding:9px 11px 11px;background:var(--panel);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(60,50,20,.22)}
#pop .phead{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
#pop .phead span{cursor:pointer;color:var(--mut);font-size:15px;line-height:1}
#pop .chips button{flex:1}
#pop .del{width:100%;margin-top:8px;color:#a33}
.shaperow{display:flex;align-items:center;gap:6px}
.shaperow span{width:12px;color:var(--mut);font-size:10px;text-align:center}
.shaperow .chips{flex:1;margin:3px 0}
.shaperow .chips{flex-wrap:wrap}
.shaperow .chips button{flex:1;min-width:44px}
.tblock{border-top:1px solid var(--line);padding-top:6px;margin-top:6px}
.tblock .thead{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:11px}
.tblock .thead input{-webkit-appearance:none;appearance:none;width:22px;height:22px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
.tblock .thead input::-webkit-color-swatch-wrapper{padding:0}
.tblock .thead input::-webkit-color-swatch{border:0;border-radius:5px}
.tblock .chips button{flex:1}
#pop{max-height:calc(100vh - 74px);overflow:auto}
.tblock .tctl{display:flex;align-items:center;gap:6px}
.tblock .eye{padding:2px 7px;font-size:10px;font-weight:500;color:var(--mut)}
.tblock.off>*:not(.thead){opacity:.35;pointer-events:none}
.tblock.off .thead>span:first-child{color:var(--mut);text-decoration:line-through}
.imgrow{display:flex;gap:5px;margin:6px 0 2px}
.imgrow .imgbtn{flex:1;padding:7px 0;font-size:10.5px;background-size:cover;background-position:center}
.imgrow .imgbtn.has{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);border-color:rgba(0,0,0,.15)}
.imgrow .imgdel{width:28px;padding:0;color:var(--mut)}
.plain>summary{display:none}
.plain{padding-top:2px}
.shaperow input[type=color]{-webkit-appearance:none;appearance:none;width:26px;height:26px;padding:0;border:1px solid var(--line);border-radius:7px;background:none;cursor:pointer;flex:none}
.shaperow input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.shaperow input[type=color]::-webkit-color-swatch{border:0;border-radius:6px}
.keys{color:var(--mut);font-size:9.5px;margin-top:8px;line-height:1.5}
</style>

<body data-tab="trails">
<nav id="nav">
  <span class="brand">Imagi Studio</span>
  <div class="tabs"><button data-tab="trails">Trail Generator</button><button data-tab="icons">Icon Library</button><button data-tab="logo">3D Logo</button></div>
</nav>
<section id="icons">
  <canvas id="iconCanvas"></canvas>
  <div class="empty" id="iconLoading"><span>Building icon…</span></div>
  <div id="iconPanel">
    <div class="ihead"><b>Icon Library</b></div>
    <div class="sub">Icon</div>
    <div id="iconPick" class="thumbs"></div>
    <div class="keys" style="margin-top:8px">Drag the icon to rotate · scroll to zoom</div>
    <div id="texRow">
      <div class="sub">Texture</div>
      <div class="seg" id="iconTex" style="grid-template-columns:1fr 1fr 1fr"><button data-t="smooth">Smooth</button><button data-t="fur">Furry</button><button data-t="metal">Metallic</button></div>
    </div>
    <div id="iconColors"></div>
    <div class="row" style="margin-top:10px"><div class="lab"><span>Shadow strength</span><em id="shadowV"></em></div><input id="shadowK" type="range" min="0" max="1" step="0.01"></div>
    <div class="btns" style="grid-template-columns:1fr"><button class="pri" id="iconExport">Export PNG</button></div>
  </div>
</section>
<iframe id="logoFrame" title="3D Logo"></iframe>
<canvas id="gl"></canvas>
<div id="hint">Loading…</div>
<div id="pop"></div>
<div id="panel">
  <div id="head"><b>Trail Generator</b><span id="hstate">hide</span></div>
  <div id="body"></div>
</div>
<script>
// ---------- master navigation: Trail Generator / Icon Library (remembered in the URL hash) ----------
(function(){
  const tabs=document.querySelectorAll('#nav .tabs button');
  function setTab(t){
    if(t!=='trails' && t!=='icons' && t!=='logo') t='trails';
    if(t==='logo'){ const f=document.getElementById('logoFrame'); if(!f.src) f.src='logo.html'; }   // loaded the first time it's opened
    document.body.dataset.tab=t; tabs.forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
    if(location.hash!=='#'+t) history.replaceState(null,'','#'+t);
  }
  tabs.forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
  // the 3D Logo frame hands finished exports up here to save
  addEventListener('message',e=>{ const d=e.data; if(!d||d.type!=='imagi-download'||!(d.blob instanceof Blob)) return;
    const a=document.createElement('a'); a.href=URL.createObjectURL(d.blob); a.download=d.name||'imagi.png';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),8000); });
  setTab((location.hash||'#trails').slice(1));
})();
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';

// ---------- palettes: colours ordered light → dark ----------
// default per-trail colours: limes and yellow-greens (one box per trail in the panel)
const DEFAULT_COLORS=['#C8F03C','#9BD62E','#E4F56A','#6FB52C','#B3E85A','#DDEB3A','#86C43A','#A8DB1F','#D2F58C','#5E9E24'];
const SHAPES = ['circle','square','star'];

const P = {
  customShapes:[], count:2, headSize:86, wiggle:1, heads:['circle','star'],
  colors:DEFAULT_COLORS.slice(), bg:'#E8DCC3',
  // advanced
  spread:0.8, gap:0, braid:1.6, lenVar:0, sizeVar:1,
  taper:0.95, tailPow:1.3, twistMax:0.3, simplify:140, liftMin:200, liftMax:500,
  headScale:1.4, puff:0.1, face:1.5, rough:1, gradient:false,
  // motion (fixed)
  bloom:0, bounce:0, stagger:0,
};
const CTRL = [
  ['Trails',[
  ]],
  ['Advanced',[
    ['braid','Braid twist (turns / 1000px)',0,4,0.01],
    ['spread','Spread',0,3,0.01],
    ['gap','Spacing',0,60,1],
    ['lenVar','Length variety',0,1,0.01],
    ['sizeVar','Size variety',0,1,0.01],
    ['taper','Taper',0,1,0.01],
    ['tailPow','Body fullness',0.5,6,0.01],
    ['twistMax','Twist (random up to)',0,4,0.01],
    ['simplify','Smooth swoosh',8,140,1],
    ['liftMin','Lift toward camera (min)',0,800,1],
    ['liftMax','Lift toward camera (max)',0,800,1],
    ['headScale','Head flare',1,2.5,0.01],
    ['puff','Puffiness',0,1.5,0.01],
    ['face','Face camera',0,1.5,0.01],
    ['rough','Matte',0.15,1,0.01],
  ]],
];

// ---------- utils ----------
const TAU=Math.PI*2, STEP=4;
const wiggleAmp=(s,amt)=>amt*(2.5+s*0.008)*Math.min(1,s/90);   // gentle side-to-side wiggle
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp01=v=>v<0?0:v>1?1:v;
function easeOutBack(x,c1){ if(x>=1) return 1; if(x<=0) return 0; const c3=c1+1; return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2); }

// ---------- cross-section profiles (unit size, counter-clockwise) ----------
const M=128;   // points around each cross-section
// resample a closed outline to M points, spacing by arc length + turning angle so tight corners keep detail
function resampleOutline(src){
  const n=src.length, w=[0];
  for(let i=0;i<n;i++){
    const a=src[(i-1+n)%n], b=src[i], c=src[(i+1)%n];
    const l=Math.hypot(c[0]-b[0],c[1]-b[1]);
    const t1=Math.atan2(b[1]-a[1],b[0]-a[0]), t2=Math.atan2(c[1]-b[1],c[0]-b[0]); let da=Math.abs(t2-t1); if(da>Math.PI) da=TAU-da;
    w.push(w[i]+l+da*0.12);
  }
  const total=w[n], out=[]; let k=0;
  for(let m=0;m<M;m++){
    const d=m/M*total; while(k<n-1 && w[k+1]<d) k++;
    const a=src[k], b=src[(k+1)%n], seg=w[k+1]-w[k], t=seg>0?(d-w[k])/seg:0;
    out.push([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]);
  }
  return out;
}
// polygon with rounded corners (each corner = quadratic curve between points `rad` along each edge)
// polygon with true circular-arc corners of radius radFor(i) (works for sharp tips and concave inner corners)
function roundedPolygon(verts, radFor){
  const n=verts.length, out=[];
  for(let i=0;i<n;i++){
    const p0=verts[(i-1+n)%n], v=verts[i], p1=verts[(i+1)%n], rho=radFor(i);
    let ax=p0[0]-v[0], ay=p0[1]-v[1], bx=p1[0]-v[0], by=p1[1]-v[1]; const la=Math.hypot(ax,ay), lb=Math.hypot(bx,by); ax/=la; ay/=la; bx/=lb; by/=lb;
    const half=Math.acos(Math.max(-1,Math.min(1,ax*bx+ay*by)))/2, d=rho/Math.tan(half);           // tangent distance from the corner
    let mx=ax+bx, my=ay+by; const ml=Math.hypot(mx,my); mx/=ml; my/=ml;                          // bisector (points into the corner's inside)
    const cx=v[0]+mx*rho/Math.sin(half), cy=v[1]+my*rho/Math.sin(half);                          // arc centre
    const t0=[v[0]+ax*d, v[1]+ay*d], t1=[v[0]+bx*d, v[1]+by*d];
    let a0=Math.atan2(t0[1]-cy,t0[0]-cx), a1=Math.atan2(t1[1]-cy,t1[0]-cx), da=a1-a0;
    while(da>Math.PI) da-=TAU; while(da<-Math.PI) da+=TAU;                                       // short way round
    for(let k=0;k<=24;k++){ const a=a0+da*k/24; out.push([cx+Math.cos(a)*rho, cy+Math.sin(a)*rho]); }
  }
  return out;
}
const PROFILES={}, PROF_MAX={};
// head outlines traced from the supplied artwork (relative sizes kept: star R≈1.18, circle r=1, square half-side≈0.92)
function arcPts(cx,cy,r,a0,a1,n,out){ for(let k=0;k<=n;k++){ const a=a0+(a1-a0)*k/n; out.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r]); } }
for(const type of SHAPES){
  let src=[];
  if(type==='star'){   // classic 5-point star (inner ratio 0.382): small round tips, wide soft inner corners
    const R=1.18, v=[]; for(let i=0;i<10;i++){ const a=Math.PI/2+i*TAU/10, r=i%2?R*0.382:R; v.push([Math.cos(a)*r,Math.sin(a)*r]); }
    src=roundedPolygon(v, i=>i%2?R*0.19:R*0.09);   // round tips + soft inner corners, as in the supplied star
  } else if(type==='square'){   // rounded rectangle, circular corners ~10% of the side
    const h=0.92, cr=0.2*h;
    arcPts( h-cr,  h-cr, cr, 0, Math.PI/2, 16, src);
    arcPts(-h+cr,  h-cr, cr, Math.PI/2, Math.PI, 16, src);
    arcPts(-h+cr, -h+cr, cr, Math.PI, Math.PI*1.5, 16, src);
    arcPts( h-cr, -h+cr, cr, Math.PI*1.5, TAU, 16, src);
  } else {
    for(let i=0;i<720;i++){ const a=i/720*TAU; src.push([Math.cos(a),Math.sin(a)]); }
  }
  PROFILES[type]=resampleOutline(src);
  PROF_MAX[type]=Math.max(...PROFILES[type].map(q=>Math.hypot(q[0],q[1])));   // true outer radius, used by the collision solver
}

// ---------- custom vector heads: an uploaded SVG's outline becomes a head shape (and the trail's cross-section) ----------
const SHAPE_NAMES={circle:'circle',square:'square',star:'star'};
function svgOutline(text){
  const data=new SVGLoader().parse(text); let best=null, bestA=0;
  for(const path of data.paths) for(const shape of SVGLoader.createShapes(path)){
    const pts=shape.getPoints(96).map(v=>[v.x,-v.y]);               // SVG y points down
    if(pts.length>2 && Math.hypot(pts[0][0]-pts.at(-1)[0],pts[0][1]-pts.at(-1)[1])<1e-6) pts.pop();
    let A=0; for(let k=0;k<pts.length;k++){ const a=pts[k], b=pts[(k+1)%pts.length]; A+=a[0]*b[1]-b[0]*a[1]; }
    if(Math.abs(A)>bestA){ bestA=Math.abs(A); best={pts,A}; } }
  if(!best) throw new Error('No filled shape found in that SVG');
  let pts=best.pts; if(best.A<0) pts=pts.reverse();                 // counter-clockwise, like the built-in shapes
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9; for(const [x,y] of pts){ x0=Math.min(x0,x); x1=Math.max(x1,x); y0=Math.min(y0,y); y1=Math.max(y1,y); }
  const cx=(x0+x1)/2, cy=(y0+y1)/2; pts=pts.map(([x,y])=>[x-cx,y-cy]);
  const R=Math.max(...pts.map(q=>Math.hypot(q[0],q[1]))); return pts.map(([x,y])=>[x/R,y/R]);   // fits a unit circle, like the others
}
function registerShape(cs){   // cs: {id, name, svg}
  if(PROFILES[cs.id]) return true;
  try{ const prof=resampleOutline(svgOutline(cs.svg)); PROFILES[cs.id]=prof; PROF_MAX[cs.id]=Math.max(...prof.map(q=>Math.hypot(q[0],q[1])));
    SHAPE_NAMES[cs.id]=cs.name; if(!SHAPES.includes(cs.id)) SHAPES.push(cs.id); return true; }
  catch(e){ alert('Could not use that SVG: '+e.message); return false; }
}
// small outline preview for a custom shape button

function toWorld(x,y,z){ const camZ=camera.position.z; z=Math.min(camZ*0.85,z); const k=(camZ-z)/camZ; return new THREE.Vector3((x-W/2)*k,(H/2-y)*k,z); }

// ---------- swept trail: profile swept along the path, closed by a soft flat-faced dome of the same profile ----------
const CAP_K=22;
function sweep(C, radii, cols, prof, twist, capDepth){
  // m+1 columns per ring (last duplicates the first) so an image can wrap all the way round
  const n=C.length, m=prof.length, M=m+1, rings=n+CAP_K;
  const pos=new Float32Array(rings*M*3), col=new Float32Array(rings*M*3), uv=new Float32Array(rings*M*2);
  const T=[], Z=new THREE.Vector3(0,0,1), q=new THREE.Quaternion();
  for(let i=0;i<n;i++){ const t=new THREE.Vector3().subVectors(C[Math.min(n-1,i+1)],C[Math.max(0,i-1)]); if(t.lengthSq()<1e-9) t.copy(T[i-1]||new THREE.Vector3(1,0,0)); T.push(t.normalize()); }
  const N=new THREE.Vector3().crossVectors(T[0],Z); if(N.lengthSq()<1e-6) N.set(0,1,0); N.normalize();
  const B=new THREE.Vector3();

  let rMax=0; for(const r of radii) rMax=Math.max(rMax,r);
  const tile=TAU*rMax*0.5 || 1; let sAcc=0;
  const ring=(ri,cx,cy,cz,Tv,r,c,ang,s)=>{
    B.crossVectors(Tv,N); const ca=Math.cos(ang), sa=Math.sin(ang);
    for(let jj=0;jj<M;jj++){ const j=jj%m;
      const px=prof[j][0]*ca-prof[j][1]*sa, py=prof[j][0]*sa+prof[j][1]*ca, k=(ri*M+jj)*3;
      pos[k]=cx+(N.x*px+B.x*py)*r; pos[k+1]=cy+(N.y*px+B.y*py)*r; pos[k+2]=cz+(N.z*px+B.z*py)*r;

    if(i>0){ q.setFromUnitVectors(T[i-1],T[i]); N.applyQuaternion(q).normalize(); sAcc+=C[i].distanceTo(C[i-1]); }   // parallel transport

  }

  const e=C[n-1], te=T[n-1], re=radii[n-1], ce=cols[n-1], ang=twist*TAU;

    idx.push(a,b,c, c,b,d);

  const nr=g.getAttribute('normal').array;

    for(let k=0;k<3;k++){ const v=(nr[a+k]+nr[b+k])*0.5; nr[a+k]=v; nr[b+k]=v; } }
  return g;
}

// ---------- strokes: each stroke = a burst of trails fanning out from the press point ----------
let strokes=[], cur=null;
const material=()=>new THREE.MeshStandardMaterial({vertexColors:true,roughness:P.rough,metalness:0});
// image surface: the picture wraps round and along the trail. Wherever a tile meets the next (and round the seam)
// it cross-fades into a half-shifted copy of itself, so there are no visible joins. A faint bump from the image
// makes it read as a real surface rather than a sticker.
const imageMaterial=tex=>{
  const m=new THREE.MeshStandardMaterial({map:tex, bumpMap:tex, bumpScale:0.9, roughness:P.rough, metalness:0});
  m.onBeforeCompile=sh=>{
    sh.uniforms.uScale=m.userData.uScale; sh.uniforms.uAspect=m.userData.uAspect;
    // seamless: 4 overlapping copies (original + shifted half a tile in u, v and both). Each copy fades to zero
    // exactly where its own edge falls, so every image edge is covered by an overlapping copy and blends away.
    const SEAM=`uniform float uScale, uAspect;
      vec2 seamUV(vec2 uv){ return uv*vec2(1.0/uAspect,1.0)/uScale; }
      vec4 seamless(sampler2D t, vec2 uv){
        vec2 q=seamUV(uv), d=abs(fract(q)-0.5)*2.0;                 // 0 mid-tile, 1 at an image edge
        vec2 w=smoothstep(0.45,1.0,d);                               // overlap band near each edge
        vec4 a=texture2D(t,q), b=texture2D(t,q+vec2(0.5,0.0)), c=texture2D(t,q+vec2(0.0,0.5)), e=texture2D(t,q+vec2(0.5,0.5));
        return mix(mix(a,b,w.x), mix(c,e,w.x), w.y); }`;
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>','#include <common>\n'+SEAM)
      .replace('#include <map_fragment>','vec4 sampledDiffuseColor=seamless(map,vMapUv); diffuseColor*=sampledDiffuseColor;')
      // bump from the same blended image, so the relief has no seam either
      .replace('#include <bumpmap_pars_fragment>',`uniform sampler2D bumpMap; uniform float bumpScale;
        vec2 dHdxy_fwd(){ vec2 dx=dFdx(vBumpMapUv), dy=dFdy(vBumpMapUv);
          float h=bumpScale*seamless(bumpMap,vBumpMapUv).x;
          return vec2(bumpScale*seamless(bumpMap,vBumpMapUv+dx).x-h, bumpScale*seamless(bumpMap,vBumpMapUv+dy).x-h); }
        vec3 perturbNormalArb(vec3 surf_pos, vec3 surf_norm, vec2 dHdxy, float faceDirection){
          vec3 sx=normalize(dFdx(surf_pos.xyz)), sy=normalize(dFdy(surf_pos.xyz)), R1=cross(sy,surf_norm), R2=cross(surf_norm,sx);
          float det=dot(sx,R1)*faceDirection; vec3 g=sign(det)*(dHdxy.x*R1+dHdxy.y*R2); return normalize(abs(det)*surf_norm-g); }`);
  };
  m.userData.uScale={value:1}; m.userData.uAspect={value:1};
  return m;
};
function newStroke(x,y){
  // each drawing keeps its own settings (editable later by clicking it); the panel sets the defaults for new ones
  return {seed:(Math.random()*2147483647)|0, pts:[{x,y,t:performance.now()}], key:'', meshes:[], count:P.count, heads:P.heads.slice(0,P.count),
    colors:P.colors.slice(0,P.count), wiggles:Array(P.count).fill(P.wiggle), headSizes:Array(P.count).fill(P.headSize),
    braid:P.braid, twist:Math.random()*P.twistMax, rot:0, hidden:Array(P.count).fill(false), images:Array(P.count).fill(null)};   // twist: braid turns (2 trails) / cross-section twist (1 trail)
}
function disposeStroke(st){
  for(const m of st.meshes){ scene.remove(m); m.geometry.dispose(); m.material.dispose(); }
  st.meshes=[]; st.key=''; st.solved=null;
}
function trailDefs(st){   // seeded per-trail character; fixed count of randoms so sliders morph smoothly
  const r=rng(st.seed), defs=[];
  for(let i=0;i<st.count;i++){
    const R=[]; for(let j=0;j<16;j++) R.push(r());
    const shape=st.heads[i]||st.heads[0];
    const c=st.colors[i%st.colors.length], c2=st.colors[(i+1)%st.count];   // gradient (optional) runs into the next trail's colour
    defs.push({R, shape, f:PROF_MAX[shape],
      head:new THREE.Color(c), tail:new THREE.Color(c2),
      size:1-P.sizeVar*0.5+R[4]*P.sizeVar, delay:i*P.stagger*(0.6+R[5]*0.8),
      len:1-P.lenVar*R[6]*0.5, twist:st.count===1 ? st.twist : R[14]*P.twistMax,
      thick:(st.headSizes[i]??st.headSizes[0])/(2*P.headScale), wig:st.wiggles[i]??st.wiggles[0]});   // head size sets thickness
  }

}
function rotated(st){   // the drawing's points turned by st.rot degrees around their centre
  if(!st.rot) return st.pts;
  let cx=0, cy=0; for(const p of st.pts){ cx+=p.x; cy+=p.y; } cx/=st.pts.length; cy/=st.pts.length;
  const a=st.rot*Math.PI/180, c=Math.cos(a), sn=Math.sin(a);
  return st.pts.map(p=>({x:cx+(p.x-cx)*c-(p.y-cy)*sn, y:cy+(p.x-cx)*sn+(p.y-cy)*c, t:p.t}));
}

  // how far the whole stroke must move forward (up) or back (down) to clear every earlier stroke it overlaps
  const clearance=trs=>{ let up=0, down=0;
    for(const t of trs) for(let i=0;i<t.m;i++){
      const cx=Math.floor(t.x[i]/cell), cy=Math.floor(t.y[i]/cell);
      for(let gx=cx-1;gx<=cx+1;gx++) for(let gy=cy-1;gy<=cy+1;gy++){ const a=h.get(gx+','+gy); if(!a) continue;
        for(let q2=0;q2<a.length;q2+=2){ const o=obstacles[a[q2]], j=a[q2+1], rr=t.r[i]*t.f+o.r[j]*o.f;
          if(Math.hypot(t.x[i]-o.x[j],t.y[i]-o.y[j])<rr*1.3){
            up=Math.max(up, o.z[j]+o.dome+rr+P.gap-t.z[i]);
            down=Math.max(down, t.z[i]+t.dome+rr+P.gap-o.z[j]); } } }
    }
    return {up,down}; };
  // rigid move: the stroke's shape never changes (so its own spacing is untouched); it goes in front of or behind
  // what it crosses — whichever is the smaller move, so overlapping bursts don't pile up toward the camera
  // where the path comes back over itself (drawn loops, strong hooks), the later part rises smoothly over the
  // earlier part. Uses the whole fan's half-width, so every trail in the burst clears.
  const rise=new Float32Array(n);
  {
    const mult=nt>1?(nt-1)/2:0, half=new Float32Array(n);
    for(let i=0;i<n;i++) half[i]=mult*spacing[i] + rmax[i] + wobA[i];
    const baseZ=i=>{ const u=i/(n-1); return liftAmt*Math.pow(u,2.2)+bend*Math.pow(Math.max(0,(u-0.6)/0.4),2.2); };
    for(let it=0;it<4;it++){
      const req=new Float32Array(n); let any=false;
      for(let i=0;i<n;i++) for(let j=0;j<i;j++){
        const rr=half[i]+half[j]; if(S[i].s-S[j].s<rr*1.6+rmax[i]*3) continue;
        if(Math.hypot(S[i].x-S[j].x,S[i].y-S[j].y)<rr*1.1+4){ const sep=(rmax[i]+rmax[j])*1.15+4, d=(baseZ(j)+rise[j])+sep-(baseZ(i)+rise[i]); if(d>req[i]){ req[i]=d; any=true; } } }
      if(!any) break;
      for(let i=0;i<n;i++){ if(req[i]<=0) continue; const hw=Math.max(6,Math.round((rmax[i]*3+half[i])/(L/(n-1))));
        for(let j=Math.max(0,i-hw);j<=Math.min(n-1,i+hw);j++) rise[j]+=req[i]*0.5*(1+Math.cos(Math.PI*(j-i)/hw)); }
    }
  }
  const trails=makeTrails(rise);
  if(obstacles.length){ const {up,down}=clearance(trails); if(up>0){ const dz = up<=down ? up : -down; for(const t of trails) for(let i=0;i<t.m;i++) t.z[i]+=dz; } }
  st.solved=trails.filter((t,ti)=>!(st.hidden&&st.hidden[ti])).map(t=>({x:t.x,y:t.y,z:t.z,r:t.r,m:t.m,f:t.f,dome:t.dome}));

  // sweep the profiles into meshes
  trails.forEach((t,ti)=>{
    const C=[]; for(let i=0;i<t.m;i++) C.push(new THREE.Vector3(t.x[i],t.y[i],t.z[i]));
    const geo=sweep(C,Array.from(t.r),t.cols,PROFILES[t.d.shape],t.d.twist,t.dome);
    let mesh=st.meshes[ti];
    if(!mesh){ mesh=new THREE.Mesh(geo,material()); mesh.userData.st=st; scene.add(mesh); st.meshes[ti]=mesh; if(selected) dimOthers(); }
    else { mesh.geometry.dispose(); mesh.geometry=geo; }
    const img=st.images&&st.images[ti];
    if(img && mesh.material.map!==img.tex){ mesh.material.dispose(); mesh.material=imageMaterial(img.tex); if(selected) dimOthers(); }
    else if(!img && mesh.material.map){ mesh.material.dispose(); mesh.material=material(); if(selected) dimOthers(); }
    if(img){ mesh.material.userData.uScale.value=img.scale; mesh.material.userData.uAspect.value=img.aspect; }
    mesh.material.roughness=P.rough; mesh.visible=!(st.hidden&&st.hidden[ti]);
  });
  return true;
}

// ---------- loop ----------
const hint=document.getElementById('hint');
hint.textContent='Drag to draw a trail';
function frame(){
  requestAnimationFrame(frame);
  if(document.body.dataset.tab!=='trails') return;   // paused while another tab is open
  try{
    const now=performance.now(), pkey=JSON.stringify(P);
    const obs=[];   // each stroke only avoids strokes drawn before it (no ping-pong)
    let changed=false;   // if a drawing changes, everything drawn after it re-checks its clearance against it
    for(const st of strokes){ if(changed) st.key=''; if(build(st,now,pkey,obs)) changed=true; if(st.solved) obs.push(...st.solved); }
    updateOutlines();
    renderer.render(scene,camera);
  }catch(e){ console.error(e); }
}
requestAnimationFrame(frame);

// ---------- input: drag to draw, click a drawing to select & edit it ----------
let drawing=null, down=null;
function addPt(st,x,y){
  const pts=st.pts, t=performance.now(); let l=pts[pts.length-1], dx=x-l.x, dy=y-l.y, d=Math.hypot(dx,dy);
  while(d>=STEP){ l={x:l.x+dx/d*STEP, y:l.y+dy/d*STEP, t}; pts.push(l); dx=x-l.x; dy=y-l.y; d=Math.hypot(dx,dy); }
}
let grab=null;   // dragging an existing drawing
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  const hit=pick(e.clientX,e.clientY);
  if(hit) grab={st:hit, x:e.clientX, y:e.clientY, dx:0, dy:0, moved:false};   // press on a drawing: click = select, drag = move
  else down={x:e.clientX,y:e.clientY};                                       // press on empty space: drag = draw
});
cv.addEventListener('pointermove',e=>{
  if(grab){
    grab.dx=e.clientX-grab.x; grab.dy=e.clientY-grab.y;
    if(!grab.moved && Math.hypot(grab.dx,grab.dy)<4) return;
    grab.moved=true; cv.style.cursor='grabbing';
    for(const m of grab.st.meshes) m.position.set(grab.dx,-grab.dy,0);   // live preview; re-solved on release
    return;
  }
  if(!down){ hoverAt={x:e.clientX,y:e.clientY}; return; }   // hover is resolved once per frame
  if(!drawing){ if(Math.hypot(e.clientX-down.x,e.clientY-down.y)<5) return;   // not a drag yet
    deselect(); drawing=newStroke(down.x,down.y); strokes.push(drawing); hint.style.opacity=0; }
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e]; for(const ev of (evs.length?evs:[e])) addPt(drawing,ev.clientX,ev.clientY);
});
cv.addEventListener('pointerup',e=>{
  if(grab){
    const g=grab; grab=null;
    if(g.moved){ for(const p of g.st.pts){ p.x+=g.dx; p.y+=g.dy; } for(const m of g.st.meshes) m.position.set(0,0,0); g.st.key=''; }
    select(g.st); cv.style.cursor='grab'; return;
  }
  if(drawing){ const p=drawing.pts, a=p[0], z=p[p.length-1]; if(p.length<3 || Math.hypot(z.x-a.x,z.y-a.y)<6){ strokes.splice(strokes.indexOf(drawing),1); disposeStroke(drawing); } }
  else if(down){ const hit=pick(e.clientX,e.clientY); hit ? select(hit) : deselect(); }
  drawing=null; down=null;
});
cv.addEventListener('pointercancel',()=>{ if(grab){ for(const m of grab.st.meshes) m.position.set(0,0,0); grab=null; } drawing=null; down=null; });
cv.addEventListener('pointerleave',()=>{ hoverAt=null; hovered=null; cv.style.cursor='crosshair'; });

// ---------- selection + per-drawing editor ----------
const ray=new THREE.Raycaster(), pop=document.getElementById('pop');
let selected=null, hovered=null, hoverAt=null;
// outlines: an inside-out copy of the surface pushed out along its normals, so only a thin rim shows around the silhouette
const outlineMat=hex=>new THREE.ShaderMaterial({side:THREE.BackSide, uniforms:{uColor:{value:new THREE.Color(hex)}, uW:{value:2.6}},
  vertexShader:'uniform float uW; void main(){ gl_Position=projectionMatrix*modelViewMatrix*vec4(position+normal*uW,1.0); }',
  fragmentShader:'uniform vec3 uColor;\nvoid main(){ gl_FragColor=vec4(uColor,1.0);\n#include <colorspace_fragment>\n}'});
const HOVER_MAT=outlineMat('#111111'), SELECT_MAT=outlineMat('#2F7BFF');
function updateOutlines(){
  if(hoverAt && !down && !grab){ const h=pick(hoverAt.x,hoverAt.y); if(h!==hovered){ hovered=h; if(selected) dimOthers(); } cv.style.cursor=hovered?'grab':'crosshair'; hoverAt=null; }
  for(const s of strokes) for(const m of s.meshes){
    const mat = s===selected ? SELECT_MAT : s===hovered ? HOVER_MAT : null;
    let o=m.userData.outline;
    if(!mat){ if(o) o.visible=false; continue; }
    if(!o){ o=new THREE.Mesh(m.geometry,mat); m.add(o); m.userData.outline=o; }
    o.geometry=m.geometry; o.material=mat; o.visible=true;
  }
}
function pick(x,y){
  ray.setFromCamera(new THREE.Vector2(x/W*2-1, -(y/H)*2+1), camera);
  const hits=ray.intersectObjects(strokes.flatMap(s=>s.meshes).filter(m=>m.visible), false);
  return hits.length ? hits[0].object.userData.st : null;
}
function dimOthers(){ for(const s of strokes) for(const m of s.meshes){ const on=!selected||s===selected||s===hovered; /* hovering a faded drawing previews it at full strength */ if(m.material.transparent!==!on){ m.material.transparent=!on; m.material.needsUpdate=true; } m.material.opacity=on?1:0.28; m.material.depthWrite=on; } }
function deselect(){ if(!selected) return; selected=null; pop.style.display='none'; dimOthers(); }
function select(st){
  selected=st; dimOthers();
  const touch=()=>{ st.key=''; };
  pop.innerHTML=`<div class="phead"><b>Drawing</b><span id="pclose">×</span></div>
    <div id="ptrails"></div>
    <div class="row"><div class="lab"><span>${st.count===2?'Braid twist':'Twist'}</span><em id="ptv"></em></div><input id="pt" type="range" min="0" max="${st.count===2?4:2}" step="0.01"></div>
    <div class="row"><div class="lab"><span>Rotate</span><em id="prv"></em></div><input id="pr" type="range" min="-180" max="180" step="1"></div>
    <button id="pdel" class="del">Delete</button>`;
  const rr=pop.querySelector('#pr'), rv=pop.querySelector('#prv');
  rr.value=st.rot; rv.textContent=Math.round(st.rot)+'°';
  rr.addEventListener('input',()=>{ st.rot=+rr.value; rv.textContent=st.rot+'°'; touch(); });
  // one block per trail: colour + head shape + head size + wiggle, all independent
  const box=pop.querySelector('#ptrails');
  for(let i=0;i<st.count;i++){
    const blk=document.createElement('div'); blk.className='tblock';
    blk.innerHTML=`<div class="thead"><span>${st.count>1?'Trail '+(i+1):'Trail'}</span><span class="tctl">${st.count>1?'<button class="eye"></button>':''}<input type="color"></span></div>
      <div class="chips"></div>
      <div class="row"><div class="lab"><span>Head size</span><em></em></div><input data-k="headSizes" type="range" min="10" max="250" step="1"></div>
      <div class="row"><div class="lab"><span>Wiggle</span><em></em></div><input data-k="wiggles" type="range" min="0" max="3" step="0.01"></div>
      <div class="imgrow"><button class="imgbtn">Add image</button><button class="imgdel" title="Remove image">×</button><input type="file" accept="image/*" hidden></div>
      <div class="row imgscale"><div class="lab"><span>Image scale</span><em></em></div><input type="range" min="0.2" max="4" step="0.01"></div>`;
    const eye=blk.querySelector('.eye');
    if(eye){ const sync=()=>{ eye.textContent=st.hidden[i]?'Show':'Hide'; blk.classList.toggle('off',!!st.hidden[i]); }; sync();
      eye.onclick=()=>{ if(!st.hidden[i] && st.hidden.filter(h=>!h).length<=1) return;   // always keep one strand visible
        st.hidden[i]=!st.hidden[i]; sync(); touch(); }; }
    // image surface for this trail
    if(!st.images) st.images=Array(st.count).fill(null);
    const ib=blk.querySelector('.imgbtn'), idel=blk.querySelector('.imgdel'), file=blk.querySelector('input[type=file]'), srow=blk.querySelector('.imgscale'), sIn=srow.querySelector('input'), sEm=srow.querySelector('em');
    const syncImg=()=>{ const im=st.images[i]; ib.textContent=im?'Change image':'Add image'; ib.style.backgroundImage=im?`url(${im.url})`:''; ib.classList.toggle('has',!!im);
      idel.style.display=im?'':'none'; srow.style.display=im?'':'none'; if(im){ sIn.value=im.scale; sEm.textContent=(+im.scale).toFixed(2)+'×'; } };
    ib.onclick=()=>file.click();
    file.onchange=()=>{ const f=file.files[0]; if(!f) return; const url=URL.createObjectURL(f);
      new THREE.TextureLoader().load(url, tex=>{ tex.colorSpace=THREE.SRGBColorSpace; tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
        const old=st.images[i]; if(old) old.tex.dispose();
        st.images[i]={tex, url, blob:f, scale:old?old.scale:1, aspect:tex.image.width/tex.image.height}; syncImg(); touch(); }); file.value=''; };
    idel.onclick=()=>{ const old=st.images[i]; if(old) old.tex.dispose(); st.images[i]=null; syncImg(); touch(); };
    sIn.addEventListener('input',()=>{ st.images[i].scale=+sIn.value; sEm.textContent=(+sIn.value).toFixed(2)+'×'; touch(); });   // touch: rebuild so the new scale is applied
    syncImg();
    const col=blk.querySelector('input[type=color]'); col.value=st.colors[i];
    col.addEventListener('input',()=>{ st.colors[i]=col.value; touch(); });
    const chips=blk.querySelector('.chips');
    for(const sh of SHAPES){ const b=document.createElement('button'); chipLabel(b,sh); b.classList.toggle('on',st.heads[i]===sh);
      b.onclick=()=>{ st.heads[i]=sh; chips.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); touch(); }; chips.appendChild(b); }
    blk.querySelectorAll('input[data-k]').forEach(inp=>{ const k=inp.dataset.k, em=inp.parentNode.querySelector('em'), f=v=>k==='headSizes'?String(Math.round(v)):(+v).toFixed(2);
      inp.value=st[k][i]; em.textContent=f(st[k][i]); inp.addEventListener('input',()=>{ st[k][i]=+inp.value; em.textContent=f(inp.value); touch(); }); });
    box.appendChild(blk);
  }
  // twist: how tightly the 2 strands braid (turns / 1000px), or how much a single trail's shape twists along its length
  const tk=st.count===2?'braid':'twist', tw=pop.querySelector('#pt'), tv=pop.querySelector('#ptv');
  tw.value=st[tk]; tv.textContent=(+st[tk]).toFixed(2);
  tw.addEventListener('input',()=>{ st[tk]=+tw.value; tv.textContent=st[tk].toFixed(2); touch(); });
  pop.querySelector('#pclose').onclick=deselect;
  pop.querySelector('#pdel').onclick=()=>{ strokes.splice(strokes.indexOf(st),1); disposeStroke(st); deselect(); };
  pop.style.display='block';
  // pinned top-left (see CSS)
}

// ---------- actions ----------
function undo(){ const s=strokes.pop(); if(s){ if(s===selected) deselect(); disposeStroke(s); } }
function clearAll(){ deselect(); strokes.forEach(disposeStroke); strokes=[]; }
function setBg(c){ P.bg=c; scene.background=new THREE.Color(c); document.body.style.background=c; window.__trailShadow(shadowK); }
function download(name,href){ const a=document.createElement('a'); a.download=name; a.href=href; a.click(); }
function savePNG(){   // transparent background, trimmed to the drawings (no selection outlines / fading)
  const sel=selected, hov=hovered; selected=null; hovered=null; dimOthers(); updateOutlines();
  const bg=scene.background; scene.background=null; renderer.setClearColor(0x000000,0);
  renderer.render(scene,camera);
  const w=cv.width, h=cv.height, full=document.createElement('canvas'); full.width=w; full.height=h;
  const fx=full.getContext('2d'); fx.drawImage(cv,0,0);
  scene.background=bg; selected=sel; hovered=hov; dimOthers();
  const d=fx.getImageData(0,0,w,h).data; let x0=w, y0=h, x1=-1, y1=-1;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++) if(d[(y*w+x)*4+3]>6){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  if(x1<0) return;   // nothing drawn
  const pad=Math.round(12*renderer.getPixelRatio()); x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad); x1=Math.min(w-1,x1+pad); y1=Math.min(h-1,y1+pad);
  const out=document.createElement('canvas'); out.width=x1-x0+1; out.height=y1-y0+1;
  out.getContext('2d').drawImage(full,x0,y0,out.width,out.height,0,0,out.width,out.height);
  download('imagi.png',out.toDataURL('image/png'));
}

// ---- pixel cursor: classic arrow pointer — raised outline pixels around a recessed fill ----
const CURSOR_PX=[
  'B',
  'BB',
  'BFB',
  'BFFB',
  'BFFFB',
  'BFFFFB',
  'BFFFFFB',
  'BFFFFFFB',
  'BFFFFFFFB',
  'BFFFFFFFFB',
  'BFFFFFFFFFB',
  'BFFFFFFBBBBB',
  'BFFFBFFB',
  'BFFB.BFFB',
  'BFB..BFFB',
  'BB....BFFB',
  'B.....BFFB',
  '.......BFFB',
  '.......BFFB',
  '........BB'];
function buildCursor(it){
  const g=new THREE.Group(), v=0.115, H=CURSOR_PX.length, Wd=12, D=0.42, FD=0.2;   // outline depth, recessed fill depth
  const parts={B:[],F:[]};
  CURSOR_PX.forEach((row,r)=>{

    let c=0; while(c<row.length){ const t=row[c]; if(t!=='B'&&t!=='F'){ c++; continue; }

      box.translate(((c+e)/2-(Wd-1)/2)*v, ((H-1)/2-r)*v, 0);   // fill centred in depth: equally recessed front and back
      parts[t].push(box); c=e+1; }

  const mF=new THREE.MeshStandardMaterial({color:it.colors[1], roughness:1, metalness:0});
  const outline=new THREE.Mesh(mergeGeometries(parts.B), mB), fill=new THREE.Mesh(mergeGeometries(parts.F), mF);
  g.add(outline, fill); g.userData.base=outline;
  g.rotation.z=0.18;   // slight lean, like the reference
  g.userData.recolor=()=>{ mB.color.set(it.colors[0]); mF.color.set(it.colors[1]); if(it.furCols) it.furCols.forEach((c,k)=>c.set(it.colors[Math.min(k,1)])); };

  const nb=outline.geometry.toNonIndexed(), nf=fill.geometry.toNonIndexed(), cb=nb.getAttribute('position').count, cf=nf.getAttribute('position').count;
  const pos=new Float32Array((cb+cf)*3), nor=new Float32Array((cb+cf)*3), which=new Float32Array((cb+cf)/3);
  pos.set(nb.getAttribute('position').array,0); pos.set(nf.getAttribute('position').array,cb*3);
  nor.set(nb.getAttribute('normal').array,0); nor.set(nf.getAttribute('normal').array,cb*3); which.fill(1,cb/3);
  g.userData.surface={pos,nor,which,n:cb+cf};

// ---- rainbow: six nested soft bands, touching (no gaps), each end rounded off ----
function buildRainbow(it){
  const g=new THREE.Group(), r0=0.25, w=0.19, D=0.34, rr=0.075, Y0=-0.62, mats=[], surfs=[];
  const EX=1.45, EY=0.82, EZ=0.22, RES=112, half=RES/2;

      y-=Y0;
      const d2 = y>=0 ? Math.abs(Math.hypot(x,y)-rc) : Math.hypot(Math.abs(x)-rc, y);   // past the base: round cap
      const dx=d2-(w/2-rr), dz=Math.abs(z)-(D/2-rr);
      return Math.hypot(Math.max(dx,0),Math.max(dz,0))+Math.min(Math.max(dx,dz),0)-rr; };
    const m=new THREE.MeshStandardMaterial({color:it.colors[5-k], roughness:1, metalness:0}); mats[5-k]=m;
    const mc=new MarchingCubes(RES, m, false, false, 200000); mc.isolation=0;

        for(let xi=0;xi<RES;xi++){ const x=(xi-half)/half*EX; f[zi*RES*RES+yi*RES+xi]=-sdf(x,y,z); } } }
    mc.update(); mc.scale.set(EX,EY,EZ); g.add(mc);

// ---- AI star: the four-point "sparkle" with sweeping concave sides, puffed up like the rest of the set ----

  it.colors.forEach((c,k)=>{
    const row=document.createElement('label'); row.className='bgrow';
    row.innerHTML=`<span>${it.colorNames?it.colorNames[k]:'Body colour'}</span><input type="color" value="${c}">`;
    row.querySelector('input').addEventListener('input',e=>{ it.colors[k]=e.target.value;
      if(it.group && it.group.userData.recolor) it.group.userData.recolor();
      else { bodyMat.color.set(e.target.value); if(furRootMat) furRootMat.color.copy(bodyMat.color).multiplyScalar(0.5); } });
    box.appendChild(row);
  });
}
// icon switcher: each icon is built once and remembers its own colours / texture
function setIcon(name){
  current=name; const it=ICONS[name];
  if(icon) pivot.remove(icon);
  if(it.colors.length===1) bodyMat.color.set(it.colors[0]);
  if(!it.group) it.group=it.build(it);
  icon=it.group; pivot.add(icon);
  document.querySelectorAll('#iconPick button').forEach(b=>b.classList.toggle('on',b.dataset.i===name));
  setTex(curTex);   // the chosen texture carries over to whichever icon you pick
  buildColorPickers();
}
// icon picker: a grid of small rendered previews (rendered once each, off to the side of the main frame)
const thumbCanvases={}, thumbQueue=[];
{ const box=document.getElementById('iconPick');
  for(const k of Object.keys(ICONS)){ const b=document.createElement('button'); b.dataset.i=k; b.title=ICONS[k].label;
    const c=document.createElement('canvas'); c.width=c.height=144; thumbCanvases[k]=c; b.appendChild(c);
    b.onclick=()=>{ if(ready) setIcon(k); }; box.appendChild(b); thumbQueue.push(k); } }
function renderThumb(k){
  const it=ICONS[k], prevIcon=icon, prevRot=pivot.rotation.clone(), prevCam=camera.position.clone(), prevCol=bodyMat.color.clone();
  if(!it.group) it.group=it.build(it);
  if(prevIcon) pivot.remove(prevIcon); pivot.add(it.group);
  if(it.colors.length===1) bodyMat.color.set(it.colors[0]);
  pivot.rotation.set(0.12,0.45,0,'XYZ'); camera.position.set(0,0,16.5); camera.lookAt(0,0,0);
  renderer.setClearColor(0x000000,0); renderer.render(scene,camera);
  const side=Math.round(cv.height*0.72), x0=Math.round((cv.width-side)/2), y0=Math.round((cv.height-side)/2), c=thumbCanvases[k], x=c.getContext('2d');
  x.clearRect(0,0,c.width,c.height); x.drawImage(cv,x0,y0,side,side,0,0,c.width,c.height);
  pivot.remove(it.group); if(prevIcon) pivot.add(prevIcon);
  pivot.rotation.copy(prevRot); camera.position.copy(prevCam); camera.lookAt(0,0,0); bodyMat.color.copy(prevCol);
}
document.getElementById('iconExport').onclick=()=>{   // transparent, trimmed to the icon
  if(!ready) return;
  renderer.setClearColor(0x000000,0); renderer.render(scene,camera);
  const w=cv.width, h=cv.height, full=document.createElement('canvas'); full.width=w; full.height=h;
  const fx=full.getContext('2d'); fx.drawImage(cv,0,0);
  const d=fx.getImageData(0,0,w,h).data; let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++) if(d[(y*w+x)*4+3]>6){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  if(x1<0) return;
  const pad=Math.round(16*renderer.getPixelRatio()); x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad); x1=Math.min(w-1,x1+pad); y1=Math.min(h-1,y1+pad);
  const out=document.createElement('canvas'); out.width=x1-x0+1; out.height=y1-y0+1;
  out.getContext('2d').drawImage(full,x0,y0,out.width,out.height,0,0,out.width,out.height);
  const a=document.createElement('a'); a.download='imagi-'+current+'.png'; a.href=out.toDataURL('image/png'); a.click();
};
function loop(){
  requestAnimationFrame(loop);
  if(document.body.dataset.tab!=='icons') return;
  if(!ready){ init(); }
  const w=cv.clientWidth, h=cv.clientHeight;
  if(cv.width!==Math.round(w*renderer.getPixelRatio()) || cv.height!==Math.round(h*renderer.getPixelRatio())){ renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
  if(thumbQueue.length) renderThumb(thumbQueue.shift());
  renderer.render(scene,camera);
}
requestAnimationFrame(loop);
window.__icons={ setAngle, ready:()=>ready, under(){ view.pitch=-1.1; view.yaw=0.3; applyView(); } };   // test hook
</script>
